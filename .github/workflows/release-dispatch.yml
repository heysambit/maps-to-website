name: Protected release dispatch
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Sealed release ID created by the operator in the builder
        required: true
        type: string
      operation:
        description: Reconcile an unknown outcome or roll back an approved release
        required: true
        type: choice
        options: [deploy, reconcile, rollback]
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.release_id }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: release-fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Consume the scoped sealed release
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          BUILDER_URL: ${{ vars.BUILDER_URL }}
          RELEASE_SERVICE_TOKEN: ${{ secrets.RELEASE_SERVICE_TOKEN }}
          RELEASE_PROVIDER: fake
          LIVE_DEPLOY_ENABLED: 'false'
          RELEASE_OPERATION: ${{ inputs.operation }}
        run: node scripts/release/cli.mjs dispatch
